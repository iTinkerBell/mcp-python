[project]
name = "mcp-server-ssh-server"
version = "0.1.0"
description = "A stdio-based MCP server installed remotely to accept clients through a secure SSH channel"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Machine-To-Machine" }]
maintainers = [
    { name = "Will Pak", email = "will@machinetomachine.ai" },
    { name = "Harold Bott Jr.", email = "harold@machinetomachine.ai" }
]
keywords = ["ssh", "mcp", "remote", "llm", "automation"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "anyio>=4.5",
    "asyncssh>=2.20.0",
    "mcp>=1.1.3",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-server-ssh-server = "mcp_server_ssh_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server_ssh_server"]

[tool.pyright]
include = ["mcp_server_ssh_server"]
venvPath = "."
venv = ".venv"

[tool.uv]
dev-dependencies = ["pyright>=1.1.389", "ruff>=0.7.3"]
